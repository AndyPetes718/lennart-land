<title>Kamelløb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: full-screen endless-runner canvas; score top-right; two big touch buttons (DUK / HOP) in the bottom corners. Single committed game look. */
:root{
  --night:#1b1230; --sand:#f3c97f; --camel:#f0ae4c; --rust:#c2552f; --ink:#fffaf0; --muted:#f3e6d0;
  --line:rgba(255,248,235,.75); --glass:rgba(30,18,40,.72); --pad-fill:rgba(30,18,40,.35);
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --b:clamp(96px,17vmin,200px);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--camel);outline-offset:3px}
.app{height:100%;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.stage{position:absolute;inset:0;overflow:hidden;background:#7cc0ee}
canvas{position:absolute;left:0;top:0;display:block}

.hud{position:absolute;top:0;right:0;left:0;display:flex;justify-content:flex-end;gap:1.2em;pointer-events:none;
  padding:2vmin max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  font-family:var(--display);font-size:clamp(18px,3.6vmin,42px);letter-spacing:.06em;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(40,20,10,.55),0 0 6px rgba(40,20,10,.35)}
.hud .hi{opacity:.75}
.hud .now.flash{animation:flash .9s steps(2,start) 1}
@keyframes flash{50%{opacity:0}}

.menu{position:absolute;inset:0}
.title{position:absolute;top:6%;left:50%;transform:translateX(-50%);text-align:center;width:min(94%,1100px);pointer-events:none}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(50px,13vmin,160px);line-height:.88;color:var(--sand);
  text-shadow:0 .05em 0 var(--rust),0 .1em 0 #7a2c1a,0 .16em .2em rgba(60,20,10,.4)}
.title p{margin:.25em 0 0;font-family:var(--display);font-size:clamp(16px,3.6vmin,42px);letter-spacing:.22em;text-transform:uppercase;color:#fff;
  text-shadow:0 3px 0 rgba(122,44,26,.9),0 0 12px rgba(122,44,26,.6)}
.list{display:flex;flex-direction:column;gap:clamp(8px,1.3vmin,14px)}
.menu .list{position:absolute;left:5%;top:36%;width:clamp(210px,30vmin,380px)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:2.5px solid var(--line);background:var(--glass);
  border-radius:16px;padding:.38em .85em;font-size:clamp(16px,2.8vmin,32px);font-weight:600;min-height:44px;white-space:nowrap}
.item .arr{opacity:0;font-size:.7em}
.item.sel{background:var(--camel);border-color:#fff3d6;color:#3a1d0c;box-shadow:0 5px 0 #a3561f}
.item.sel .arr{opacity:1}
.item .cyc{font-weight:700}
.side{position:absolute;right:4%;top:36%;width:clamp(200px,27vmin,340px);background:var(--glass);border:2px solid var(--line);border-radius:16px;
  padding:.8em 1em;font-size:clamp(13px,2vmin,22px);line-height:1.4}
.side h2{margin:0 0 .2em;font-family:var(--display);font-weight:400;font-size:1.25em;color:var(--sand)}
.side .rec{font-family:var(--display);font-size:1.7em;font-variant-numeric:tabular-nums}
.side ul{margin:.5em 0 0;padding:0;list-style:none;color:var(--muted);font-size:.88em}
.side li+li{margin-top:.15em}
.hero{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px rgba(80,40,10,.35))}

.over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2.2vmin;text-align:center;pointer-events:none}
.over h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,10vmin,120px);color:var(--sand);letter-spacing:.06em;
  text-shadow:0 .05em 0 var(--rust),0 .1em 0 #7a2c1a}
.over .sub{font-family:var(--display);font-size:clamp(18px,3.6vmin,40px);text-shadow:0 2px 0 rgba(40,20,10,.6)}
.over .rec{color:#ffe08a}
.again{pointer-events:auto;width:clamp(72px,13vmin,140px);aspect-ratio:1;border-radius:22%;border:3px solid #fff3d6;background:var(--camel);color:#3a1d0c;
  display:grid;place-items:center;box-shadow:0 6px 0 #a3561f}
.again svg{width:55%;height:55%;fill:currentColor}
.hint{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(20px,4.4vmin,52px);
  text-shadow:0 3px 0 rgba(40,20,10,.6);pointer-events:none;text-align:center;width:min(92%,900px);text-wrap:balance;animation:pulse 1.4s ease-in-out infinite}
.hint small{display:block;font-family:var(--body);font-weight:600;font-size:.5em;margin-top:.3em;opacity:.9}
@keyframes pulse{50%{opacity:.6}}

.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,18,48,.55);backdrop-filter:blur(3px)}
.card{width:min(92%,480px);background:var(--glass);border:2.5px solid var(--line);border-radius:22px;padding:clamp(16px,3vmin,36px);text-align:center}
.card h2{margin:0 0 .5em;font-family:var(--display);font-weight:400;font-size:clamp(34px,7vmin,76px);color:var(--sand);text-shadow:0 4px 0 var(--rust)}
.card .list .item{justify-content:center}

.pads{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;pointer-events:none;transition:opacity .4s;
  padding:0 max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.app.kbd .pads{opacity:.3}
.pad{pointer-events:auto;width:var(--b);aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--pad-fill);color:var(--ink);
  display:grid;place-items:center;align-content:center;gap:.1em;padding:0;touch-action:none;transition:transform .06s,background .06s}
.pad svg{width:38%;height:38%;fill:currentColor}
.pad span{font-family:var(--display);font-size:calc(var(--b) * .15);letter-spacing:.06em}
.pad.down{background:var(--camel);color:#3a1d0c;border-color:var(--camel);transform:scale(.93)}
.pause{position:absolute;top:calc(2vmin + 2px);left:max(16px,env(safe-area-inset-left,0px));width:clamp(44px,7vmin,72px);aspect-ratio:1;border-radius:50%;
  border:2.5px solid var(--line);background:var(--pad-fill);display:grid;place-items:center;padding:0}
.pause svg{width:40%;height:40%;fill:var(--ink)}
.pause.home{left:calc(max(16px,env(safe-area-inset-left,0px)) + clamp(44px,7vmin,72px) + 12px)}
.home svg{width:46%;height:46%}
.overbtns{display:flex;align-items:center;gap:2vmin}
.tomenu{pointer-events:auto;font-family:var(--display);font-size:clamp(18px,3.4vmin,36px);padding:.45em 1.1em;border-radius:999px;border:3px solid #fff3d6;background:var(--glass);color:var(--ink)}
.keyhint{font-size:clamp(13px,2vmin,20px);opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@media (max-aspect-ratio:1/1){
  :root{--b:clamp(96px,30vw,170px)}
  .menu .list{left:16px;top:32%;width:58%}
  .side{display:none}
  .hero{left:80%}
}
</style>

/* audio */
let ac=null,master=null,noiseBuf=null;
function audio(){if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();master=ac.createGain();master.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  master.gain.value=set.sound?.45:0;if(ac.state==='suspended')ac.resume();}
function blip(f0,f1,dur,type='square',vol=.15,t=0){if(!ac)return;const T=ac.currentTime+t,o=ac.createOscillator(),gg=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,T);if(f1)o.frequency.exponentialRampToValueAtTime(f1,T+dur);
  gg.gain.setValueAtTime(vol,T);gg.gain.exponentialRampToValueAtTime(.0001,T+dur);o.connect(gg).connect(master);o.start(T);o.stop(T+dur+.02);}
function hiss(dur,freq,vol){if(!ac)return;const T=ac.currentTime,s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const gg=ac.createGain();
  gg.gain.setValueAtTime(vol,T);gg.gain.exponentialRampToValueAtTime(.0001,T+dur);s.connect(f).connect(gg).connect(master);s.start(T);s.stop(T+dur);}
const sfx={jump:()=>blip(300,700,.14,'square',.11),point:()=>{blip(988,0,.08,'square',.1);blip(1319,0,.25,'square',.1,.08);},
  hit:()=>{hiss(.35,900,.45);blip(220,60,.35,'triangle',.35);},duck:()=>blip(200,120,.06,'triangle',.15),go:()=>{[523,659,784].forEach((f,i)=>blip(f,0,.1,'square',.1,i*.08));}};

/* state */
let screen='menu',R=null;
function newRun(){
  R={speed:360,dist:0,score:0,shown:-1,obs:[],gap:500,night:0,nightT:0,lastNight:0,t:0,dead:false,deadT:0,
     p:{y:GY,vy:0,ground:true,duck:false,phase:0,squash:0,hold:false},groundOff:0,flashT:0};
}
newRun();
const keys={jump:0,duck:0};const touch={jump:0,duck:0};
const holdJ=()=>keys.jump||touch.jump,holdD=()=>keys.duck||touch.duck;

function start(){audio();newRun();screen='ready';$('#menu').hidden=true;$('#over').hidden=true;$('#modal').hidden=true;$('#hud').hidden=false;$('#pads').hidden=false;$('#pauseBtn').hidden=false;$('#homeBtn').hidden=false;
  const h=$('#hint');h.innerHTML='Tryk mellemrum eller en piletast for at løbe<small>eller tryk på skærmen</small>';h.hidden=false;hud(true);}
function go(withJump){if(screen!=='ready')return;screen='play';R.waitRelease=true;$('#hint').hidden=true;sfx.go();if(withJump)jump(true);}
function restart(){start();}
function jump(force){const p=R.p;if(!p.ground&&!force)return;p.vy=-920;p.ground=false;p.hold=true;sfx.jump();}
function crash(){R.dead=true;R.deadT=0;sfx.hit();screen='over';const s=Math.floor(R.score);const rec=s>best;if(rec){best=s;try{localStorage.setItem('lennart-run-best',best)}catch(e){}}
  $('#overScore').innerHTML=`${s} point${rec?' · <span class="rec">Ny rekord!</span>':''}`;
  setTimeout(()=>{if(screen==='over')$('#over').hidden=false;},350);hud(true);}

/* obstacles */
const CACT=[{w:24,h:48},{w:32,h:66},{w:22,h:40}];
function spawn(){
  const s=R.score,x=VW+40;let o;
  if(s>250&&Math.random()<.28){const lv=[GY-14,GY-46,GY-90][Math.floor(Math.random()*3)];o={k:'bird',x,y:lv-26,w:52,h:26,fl:Math.random()*6};}
  else{const n=s<120?1:1+Math.floor(Math.random()*(s<400?2:3));const big=Math.random()<.45;const parts=[];let w=0;
    for(let i=0;i<n;i++){const c=CACT[big?1:(Math.random()<.5?0:2)];parts.push({dx:w,w:c.w,h:c.h,seed:Math.random()});w+=c.w+4;}
    const h=Math.max(...parts.map(p=>p.h));o={k:'cactus',x,y:GY-h,w:w-4,h,parts};}
  R.obs.push(o);
  const minGap=R.speed*.62+120;R.gap=minGap+Math.random()*(R.speed*.75);
}
const LX=96,LW=46;
function lennartBox(){const p=R.p,h=p.duck&&p.ground?40:66;return{x:LX+8,y:p.y-h,w:LW-14,h:h-6};}

function step(dt){
  if(screen!=='play')return;
  R.t+=dt;R.speed=Math.min(1050,R.speed+9*dt);
  const mv=R.speed*dt;R.dist+=mv;R.groundOff+=mv;R.score+=mv*.022;
  const p=R.p;
  p.duck=holdD();
  if(R.waitRelease&&!holdJ())R.waitRelease=false;
  if(p.ground&&holdJ()&&!p.duck&&!R.waitRelease)jump();
  const grav=(!p.ground&&p.duck)?7500:(p.vy<0&&holdJ()?2200:3600);
  if(!p.ground){p.vy+=grav*dt;p.y+=p.vy*dt;if(p.y>=GY){p.y=GY;p.vy=0;p.ground=true;p.squash=.12;}}
  p.phase+=R.speed*dt*.028;p.squash=Math.max(0,p.squash-dt*.7);
  for(const o of R.obs){o.x-=mv;if(o.k==='bird'){o.x-=40*dt;o.fl+=dt*9;}}
  R.obs=R.obs.filter(o=>o.x+o.w>-60);
  const last=R.obs[R.obs.length-1];if(!last||last.x<VW+40-R.gap)spawn();
  const b=lennartBox();
  for(const o of R.obs){const ob=o.k==='bird'?{x:o.x+6,y:o.y+8,w:o.w-12,h:o.h-12}:{x:o.x+4,y:o.y+6,w:o.w-8,h:o.h-6};
    if(b.x<ob.x+ob.w&&b.x+b.w>ob.x&&b.y<ob.y+ob.h&&b.y+b.h>ob.y){crash();return;}}
  const s=Math.floor(R.score);
  if(Math.floor(s/100)>Math.floor((s-1)/100)&&s>0&&s!==R.lastPt){R.lastPt=s;sfx.point();const n=$('#hNow');n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');}
  if(s>0&&s%700===0&&s!==R.lastNight){R.lastNight=s;R.nightT=1-R.nightT;}
  R.night+=(R.nightT-R.night)*Math.min(1,dt*.8);
  hud();
}
const pad5=n=>String(Math.max(0,n)).padStart(5,'0');
function hud(force){const s=Math.floor(R.score);if(s===R.shown&&!force)return;R.shown=s;$('#hNow').textContent=pad5(s);$('#hHi').textContent=pad5(best);}

const mix=(a,b,t)=>{const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));return'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')+')';};

function drawCactus(x,y,w,h,seed){

  if(p.duck&&p.ground){sy=.6;sx=1.22;rot=.08;oy=0;}
  g.save();g.translate(LX+LW/2,p.y+oy);g.scale(sx,sy);g.rotate(rot);g.drawImage(SIDE,-W*.5,-H+3,W,H);g.restore();
  if(p.ground&&screen==='play'){g.fillStyle='rgba(214,150,80,.6)';for(let i=0;i<3;i++){const k=((R.t*6+i/3)%1);g.beginPath();g.arc(LX-4-k*30,GY-4-k*8,4*(1-k),0,7);g.fill();}}
}
function render(t){
  const ex=+cv.dataset.extra||0;g.setTransform(SC*DPR,0,0,SC*DPR,0,ex*SC*DPR);
  const n=R.night,off=screen==='menu'?t*120:R.groundOff,Hf=cv.height/(SC*DPR);
  const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,mix('4fa3e3','1b1640',n));gr.addColorStop(.6,mix('9fd3f2','3a2a66',n));gr.addColorStop(1,mix('ffe7b0','8a4a6a',n));
  g.fillStyle=gr;g.fillRect(0,-ex,VW,Hf);
  if(n>.05){g.fillStyle='#fff6e6';for(const s of STARS){g.globalAlpha=n*(.4+.5*Math.sin(t*2+s.p)**2);g.beginPath();g.arc(s.x*VW,s.y*GY,s.r,0,7);g.fill();}g.globalAlpha=1;}
  const sx=VW*.8,sy=70;g.fillStyle=n<.5?'rgba(255,243,181,'+(1-n*2)+')':'rgba(240,236,220,'+(n*2-1)+')';g.beginPath();g.arc(sx,sy,n<.5?34:26,0,7);g.fill();
  if(n>.5){g.fillStyle=mix('4fa3e3','1b1640',n);g.beginPath();g.arc(sx+11,sy-6,22,0,7);g.fill();}
  g.fillStyle=n>.5?'rgba(255,220,230,.18)':'rgba(255,255,255,.85)';
  for(let i=0;i<5;i++){const x=((i*260-off*.08)%(VW+300)+VW+300)%(VW+300)-150,y=40+(i*53)%90;[[0,0,34,12],[24,-8,22,14],[-18,-3,18,10]].forEach(([a,b,rx,ry])=>{g.beginPath();g.ellipse(x+a,y+b,rx,ry,0,0,7);g.fill();});}
  const pc=mix('e9b97a','5a3554',n),ps=mix('d39b5c','462847',n);
  for(let i=-1;i<VW/420+2;i++){const bx=i*420-((off*.12)%420),b=GY-30;g.fillStyle=pc;g.beginPath();g.moveTo(bx,b);g.lineTo(bx+110,b-95);g.lineTo(bx+220,b);g.fill();g.fillStyle=ps;g.beginPath();g.moveTo(bx+110,b-95);g.lineTo(bx+220,b);g.lineTo(bx+150,b);g.fill();}
  [[.25,GY-26,mix('f0c27a','6e3f55',n),18,.012],[.5,GY-8,mix('e5a95f','5a3148',n),12,.02]].forEach(([par,y0,col,amp,fq])=>{const o=off*par;g.fillStyle=col;g.beginPath();g.moveTo(0,GY+2);
    for(let x=0;x<=VW+16;x+=16){const wx=x+o;g.lineTo(x,y0-amp*(Math.sin(wx*fq)*.6+Math.sin(wx*fq*2.3+1)*.4+.6));}g.lineTo(VW,GY+2);g.fill();});
  g.fillStyle=mix('f6cf88','8a5a5a',n);g.fillRect(0,GY-2,VW,8);g.fillStyle=mix('d69650','5e3a44',n);g.fillRect(0,GY+6,VW,Hf+200);
  g.fillStyle=mix('b97a3b','4a2c38',n);for(let i=0;i<40;i++){const x=((i*97-off)%(VW+60)+VW+60)%(VW+60)-30,y=GY+12+(i*37)%46;g.fillRect(x,y,i%3?3:6,2);}
  g.strokeStyle=mix('e4b46a','7a4a55',n);g.lineWidth=1.5;for(let i=0;i<14;i++){const x=((i*131-off)%(VW+80)+VW+80)%(VW+80)-40;g.beginPath();g.moveTo(x,GY+2);g.quadraticCurveTo(x+8,GY,x+16,GY+2);g.stroke();}
  if(screen!=='menu'){for(const o of R.obs){if(o.k==='bird')drawBird(o);else for(const c of o.parts)drawCactus(o.x+c.dx,GY-c.h,c.w,c.h,c.seed);}drawLennart(t);}
}

/* menu + cards */
let list=null;
function renderList(el){const L=list;el.innerHTML='';L.items.forEach((it,i)=>{const b=document.createElement('button');b.className='item'+(i===L.sel?' sel':'');
  b.innerHTML=`<span>${it.label}</span>`+(it.cycle?`<span class="cyc">‹ ${it.value()} ›</span>`:'<span class="arr">▶</span>');
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audio();L.sel=i;if(it.act)it.act();else it.cycle(1);refresh();});el.appendChild(b);});L.el=el;}
function refresh(){if(list&&list.el&&document.body.contains(list.el))renderList(list.el);}
function listInput(btn){const L=list;if(!L)return;const it=L.items[L.sel];
  if(btn==='up')L.sel=(L.sel+L.items.length-1)%L.items.length;else if(btn==='down')L.sel=(L.sel+1)%L.items.length;
  else if((btn==='left'||btn==='right')&&it.cycle)it.cycle(btn==='left'?-1:1);else if(btn==='ok'){if(it.act)it.act();else it.cycle(1);}refresh();}
function showMenu(){screen='menu';newRun();$('#menu').hidden=false;$('#over').hidden=true;$('#modal').hidden=true;$('#hud').hidden=true;$('#pads').hidden=true;$('#pauseBtn').hidden=true;$('#homeBtn').hidden=true;$('#hint').hidden=true;
  $('#rec').textContent=best.toLocaleString('da-DK');
  list={sel:0,items:[{label:'Start',act:start},{label:'Lyd',cycle:()=>{set.sound=!set.sound;saveSet();if(master)master.gain.value=set.sound?.45:0;},value:()=>set.sound?'Til':'Fra'},
    {label:'Fuld skærm',act:()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}},
    ...(EMB?[{label:'Alle spil',act:exitHub}]:[])]};renderList($('#menuList'));}
function pause(){if(screen!=='play')return;screen='pause';$('#modal').hidden=false;$('#card').innerHTML='<h2>Pause</h2><div class="list" id="cList"></div>';
  list={sel:0,items:[{label:'Fortsæt',act:resume},{label:'Start forfra',act:()=>{$('#modal').hidden=true;list=null;start();}},{label:'Til menuen',act:showMenu}]};renderList($('#cList'));}
function resume(){$('#modal').hidden=true;screen='play';list=null;keys.jump=keys.duck=0;}

/* input */
function press(b){
  audio();
  if(screen==='menu'||screen==='pause'){
    if(b==='back'){if(screen==='pause')resume();else if(EMB)exitHub();return;}
    if(b==='jump')b='up';if(b==='duck')b='down';listInput(b);return;}
  if(screen==='ready'){if(b==='back')showMenu();else if(['jump','ok','left','right','duck'].includes(b))go(false);return;}
  if(screen==='over'){if((b==='jump'||b==='ok')&&R.deadT>.4)restart();else if(b==='back')showMenu();return;}
  if(screen==='play'){if(b==='jump')jump();else if(b==='duck'&&R.p.ground)sfx.duck();else if(b==='back')pause();}
}
const KEYS={' ':'jump',w:'jump',ArrowUp:'jump',s:'duck',ArrowDown:'duck',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',Enter:'ok',Escape:'back',p:'back'};
window.addEventListener('keydown',e=>{const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(!k)return;e.preventDefault();app.classList.add('kbd');
  if(k==='jump')keys.jump=1;if(k==='duck')keys.duck=1;if(e.repeat)return;
  if(screen==='menu'||screen==='pause'){if(k==='jump'&&e.key===' ')press('ok');else press(k);}else press(k);});
window.addEventListener('keyup',e=>{const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(k==='jump')keys.jump=0;if(k==='duck')keys.duck=0;});
document.querySelectorAll('.pad').forEach(b=>{const k=b.dataset.btn;
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();app.classList.remove('kbd');try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('down');touch[k]=1;press(k);});
  const up=()=>{b.classList.remove('down');touch[k]=0;};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));b.addEventListener('contextmenu',e=>e.preventDefault());});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(screen==='play'||screen==='over'||screen==='ready'){app.classList.remove('kbd');touch.jump=1;press('jump');}});
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('.pad'))touch.jump=0;}));
$('#again').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audio();restart();});
$('#pauseBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pause();});
$('#homeBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();showMenu();});
$('#toMenu').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();showMenu();});
window.addEventListener('blur',()=>{keys.jump=keys.duck=0;if(screen==='play')pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='play')pause();});

/* resize + loop */
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;DPR=Math.min(2,devicePixelRatio||1);
  const res=r.height>r.width?Math.min(r.height*.3,parseFloat(getComputedStyle($('.pad')).width)+44):0;const H=r.height-res;
  SC=Math.min(H/VH,r.width/520);VW=r.width/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  // world anchored to bottom: shift so ground sits at same distance from the bottom
  const extra=H/SC-VH;cv.dataset.extra=extra;
  FRONT.style.height=(110*SC)+'px';FRONT.style.bottom=(res+(VH-GY)*SC-4)+'px';}
new ResizeObserver(resize).observe(stage);resize();
let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);const fdt=Math.min(.1,(now-last)/1000);acc+=fdt;last=now;if(screen==='over')R.deadT+=fdt;while(acc>=1/120){step(1/120);acc-=1/120;}
  render(now/1000);
  if(screen==='menu'){const b=Math.abs(Math.sin(now/1000*Math.PI*1.4));FRONT.style.transform=`translateX(-50%) translateY(${-b*14}px)`;}}
showMenu();requestAnimationFrame(frame);
})();
</script>
