<title>Ørkenhop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: full-screen canvas world; HUD strip on top; touch controller over the bottom corners (landscape) or below (portrait). Single committed game look. */
:root{
  --night:#1b1230; --sand:#f3c97f; --camel:#f0ae4c; --rust:#c2552f; --sky:#5aa9e6; --palm:#3f9a5a;
  --ink:#fffaf0; --line:rgba(255,248,235,.75); --glass:rgba(30,18,40,.72); --pad-fill:rgba(30,18,40,.38);
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --c:clamp(150px,25vmin,330px);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--camel);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:1fr;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.stage{position:relative;overflow:hidden;min-height:0;background:#7cc0ee}
canvas{position:absolute;left:0;top:0;display:block}

.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;pointer-events:none;
  padding:1.6vmin max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  font-family:var(--display);font-size:clamp(14px,3vmin,34px);color:var(--ink);text-shadow:0 2px 0 rgba(40,20,10,.55),0 0 6px rgba(40,20,10,.35)}
.hud div{min-width:0;white-space:nowrap}
.hud .lbl{display:block;font-size:.62em;letter-spacing:.12em;opacity:.9}
.hud .val{font-variant-numeric:tabular-nums}
.hud .coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4b0,#ffcf3f 45%,#d48a12);vertical-align:-.05em;margin-right:.15em}

.menu{position:absolute;inset:0}
.title{position:absolute;top:5%;left:50%;transform:translateX(-50%);text-align:center;width:min(94%,1100px);pointer-events:none}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,12vmin,150px);line-height:.88;color:var(--sand);
  text-shadow:0 .05em 0 var(--rust),0 .1em 0 #7a2c1a,0 .16em .2em rgba(60,20,10,.4)}
.title p{margin:.25em 0 0;font-family:var(--display);font-size:clamp(18px,4.4vmin,52px);letter-spacing:.22em;text-transform:uppercase;color:#fff;
  text-shadow:0 3px 0 rgba(122,44,26,.9),0 0 12px rgba(122,44,26,.6)}
.list{display:flex;flex-direction:column;gap:clamp(8px,1.3vmin,14px)}
.menu .list{position:absolute;left:5%;top:34%;width:clamp(210px,31vmin,390px)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:2.5px solid var(--line);background:var(--glass);
  border-radius:16px;padding:.38em .85em;font-size:clamp(16px,2.8vmin,32px);font-weight:600;min-height:44px;white-space:nowrap}
.item .arr{opacity:0;font-size:.7em}
.item.sel{background:var(--camel);border-color:#fff3d6;color:#3a1d0c;box-shadow:0 5px 0 #a3561f}
.item.sel .arr{opacity:1}
.item .cyc{font-weight:700}
.side{position:absolute;right:4%;top:34%;width:clamp(200px,27vmin,350px);background:var(--glass);border:2px solid var(--line);border-radius:16px;
  padding:.8em 1em;font-size:clamp(13px,2vmin,22px);line-height:1.4}
.side h2{margin:0 0 .25em;font-family:var(--display);font-weight:400;font-size:1.25em;color:var(--sand)}
.side .rec{font-family:var(--display);font-size:1.6em;font-variant-numeric:tabular-nums}
.side ul{margin:.5em 0 0;padding:0;list-style:none;color:#f3e6d0;font-size:.88em}
.side li+li{margin-top:.15em}
.hero{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px rgba(80,40,10,.35))}

.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,18,48,.55);backdrop-filter:blur(3px)}
.card{width:min(92%,520px);background:var(--glass);border:2.5px solid var(--line);border-radius:22px;padding:clamp(16px,3vmin,36px);text-align:center}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,7vmin,76px);color:var(--sand);text-shadow:0 4px 0 var(--rust)}
.card .big{font-family:var(--display);font-size:clamp(28px,6vmin,64px);font-variant-numeric:tabular-nums}
.card .note{color:#ffd2a8;font-weight:700;min-height:1.3em;margin-bottom:.6em}
.card img{height:clamp(80px,16vmin,180px);margin:.2em auto;display:block}
.card .list .item{justify-content:center}

.intro{position:absolute;inset:0;background:#120b20;display:grid;place-content:center;justify-items:center;gap:2vmin;font-family:var(--display);text-align:center}
.intro .lvl{font-size:clamp(30px,7vmin,80px);color:var(--sand)}
.intro .sub{font-size:clamp(18px,3.6vmin,40px);color:#f3e6d0}
.intro .lives{display:flex;align-items:center;gap:.4em;font-size:clamp(26px,5.5vmin,60px)}
.intro .lives img{height:1.8em}

.controls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;transition:opacity .4s;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.app.kbd .controls{opacity:.3}
.cluster{position:relative;width:var(--c);height:calc(var(--c) * 1.22);pointer-events:auto;touch-action:none}
.cb{position:absolute;display:grid;place-items:center;border:2.5px solid var(--line);background:var(--pad-fill);color:var(--ink);
  border-radius:50%;padding:0;font-family:var(--body);font-weight:700;touch-action:none;transition:transform .06s,background .06s}
.cb svg{width:42%;height:42%;fill:currentColor}
.cb.down{background:var(--camel);color:#3a1d0c;border-color:var(--camel);transform:scale(.93)}
.pill{border-radius:999px;font-size:calc(var(--c) * .1)}
.disc{position:absolute;border-radius:50%;border:2.5px solid var(--line);background:rgba(30,18,40,.22);touch-action:none}
.dot{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line)}
.letter{font-size:calc(var(--c) * .15);font-family:var(--display);font-weight:400}
.cap{position:absolute;font-size:calc(var(--c) * .065);font-weight:700;color:var(--ink);opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}

@media (max-aspect-ratio:1/1){
  :root{--c:clamp(140px,42vw,250px)}
  .app{grid-template-rows:1fr auto}
  .controls{position:static;background:#1b1230;padding-top:14px;border-top:2px solid rgba(255,248,235,.15)}
  .app.kbd .controls{opacity:1}
  .menu .list{left:16px;top:30%;width:56%}
  .side{display:none}
  .hero{left:80%}
}
</style>

function makeBuilder(w){
  const gr=[];for(let y=0;y<ROWS;y++)gr.push(new Array(w).fill('.'));
  const L={w,g:gr,ents:[],carpets:[],decor:[],
    t(x,y,c){if(x>=0&&x<w&&y>=0&&y<ROWS)gr[y][x]=c;},
    gnd(a,b){for(let x=a;x<b;x++)for(let y=12;y<ROWS;y++)L.t(x,y,'#');},
    row(a,b,y,c){for(let x=a;x<b;x++)L.t(x,y,c);},
    col(x,h){for(let i=0;i<h;i++)L.t(x,11-i,'X');},
    up(x,n){for(let i=0;i<n;i++)L.col(x+i,i+1);},
    down(x,n){for(let i=0;i<n;i++)L.col(x+i,n-i);},
    e(x,type,y=11){L.ents.push({tx:x,ty:y,type});},
    arc(x0,n,y){for(let i=0;i<n;i++){const k=i/(n-1||1);L.t(x0+i,Math.round(y-Math.sin(k*Math.PI)*2),'C');}},
    carpet(x,y,range,speed){L.carpets.push({x0:x*TS,y:y*TS,w:3*TS,h:14,range:range*TS,speed,ph:0,x:x*TS,dx:0});},
  };
  return L;
}

const WALK=230,RUN=380,ACC_G=1150,ACC_A=820,DEC=1500,SKID=2800,JUMP=800,G_HOLD=1500,G_FULL=2900,MAXF=950;

function newGame(start){

function freshPlayer(x){return{x,y:12*TS-50,w:32,h:50,vx:0,vy:0,ground:false,face:1,big:false,inv:0,coyote:0,jbuf:0,phase:0,plat:null,dead:false,deadT:0,squash:0,skid:false,hidden:false,jumpHeld:false};}
function startLevel(){
  lv=buildLevel(G.li);
  const sx=G.check?lv.checkX:3;
  G.p=freshPlayer(sx*TS+8);G.camX=Math.max(0,G.p.x-VW*.35);
  G.enemies=lv.ents.map(s=>{const w=s.type==='beetle'?38:40,h=s.type==='beetle'?28:32;return{type:s.type,x:s.tx*TS+(TS-w)/2,y:(s.ty+1)*TS-h,w,h,vx:-(s.type==='beetle'?55:60),vy:0,active:false,state:'walk',t:0,anim:Math.random()*6};}).filter(e=>!G.check||e.x>sx*TS+VW*.6);
  G.items=[];G.parts=[];G.pops=[];G.bumps=[];G.time=lv.time;G.tacc=0;G.combo=0;G.freeze=0;G.grow=0;G.goal=null;G.clock=0;G.hurried=false;

/* ===================== Physics helpers ===================== */
function tile(x,y){if(y<0||y>=ROWS)return '.';if(x<0||x>=lv.w)return '#';return lv.g[y][x];}
function solid(x,y){if(y>=ROWS)return false;if(x<0||x>=lv.w)return true;if(y<0)return false;return SOLID.has(lv.g[y][x]);}
function collideX(e,dir){
  if(!dir)return 0;const t=Math.floor(e.y/TS),b=Math.floor((e.y+e.h-.01)/TS);
  if(dir>0){const c=Math.floor((e.x+e.w)/TS);for(let r=t;r<=b;r++)if(solid(c,r)){e.x=c*TS-e.w-.01;return 1;}}
  else{const c=Math.floor(e.x/TS);for(let r=t;r<=b;r++)if(solid(c,r)){e.x=(c+1)*TS+.01;return -1;}}
  return 0;
}
function landY(e){const r=Math.floor((e.y+e.h)/TS),l=Math.floor((e.x+1)/TS),rr=Math.floor((e.x+e.w-1)/TS);for(let c=l;c<=rr;c++)if(solid(c,r)){e.y=r*TS-e.h;return true;}return false;}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function addScore(n,x,y){G.score+=n;if(x!==undefined)G.pops.push({x,y,txt:String(n),t:0});}
function addCoin(){G.coins++;sfx.coin();G.score+=200;if(G.coins>=100){G.coins-=100;oneUp();}}
function oneUp(x,y){G.lives++;sfx.up1();if(x!==undefined)G.pops.push({x,y,txt:'1-OP',t:0});}
const COMBO=[100,200,400,500,800,1000,2000,4000,5000,8000];
function comboScore(x,y){const i=G.combo++;if(i>=COMBO.length){oneUp(x,y);}else addScore(COMBO[i],x,y);}

/* ===================== Input ===================== */
const kb={left:0,right:0,up:0,down:0,a:0,b:0,l:0,r:0};const tp={left:0,right:0,up:0,down:0,a:0,b:0,l:0,r:0};
const held=k=>kb[k]||tp[k];
function I(){return{left:held('left'),right:held('right'),jump:held('a')||held('up')||held('r'),run:held('b')||held('l')||set.auto};}

/* ===================== Update ===================== */
function setBig(b){const p=G.p,bot=p.y+p.h;p.big=b;p.w=b?38:32;p.h=b?84:50;p.y=bot-p.h;}
function hurt(){const p=G.p;if(p.inv>0||p.dead||G.goal)return;if(p.big){setBig(false);p.inv=2;sfx.shrink();G.freeze=.7;G.grow=-1;}else die(false);}
function die(fell){const p=G.p;if(p.dead)return;p.dead=true;p.deadT=0;p.vy=fell?0:-820;p.vx=0;p.fell=fell;stopMusic();sfx.die();if(!G.check&&p.x>lv.checkX*TS)G.check=true;}
function hitBlock(tx,ty){
  const c=tile(tx,ty),p=G.p;
  for(const e of G.enemies){if(!e.dead&&Math.abs(e.y+e.h-ty*TS)<8&&e.x+e.w>tx*TS&&e.x<(tx+1)*TS)killFlip(e,e.x+e.w/2<tx*TS+TS/2?-1:1);}
  if(tile(tx,ty-1)==='C'){lv.g[ty-1][tx]='.';addCoin();G.items.push({k:'pop',x:tx*TS+TS/2,y:(ty-1)*TS,vy:-600,t:.45});}
  if(c==='S'){lv.g[ty][tx]='U';G.bumps.push({x:tx,y:ty,t:0});G.items.push({k:'pop',x:tx*TS+TS/2,y:ty*TS-8,vy:-700,t:.5});addCoin();}
  else if(c==='P'){lv.g[ty][tx]='U';G.bumps.push({x:tx,y:ty,t:0});G.items.push({k:'drop',x:tx*TS+8,y:ty*TS,w:32,h:36,vx:0,vy:0,em:.6,sy:ty*TS});sfx.sprout();}
  else if(c==='B'){if(p.big){lv.g[ty][tx]='.';addScore(50);sfx.brk();for(let i=0;i<4;i++)G.parts.push({x:tx*TS+12+(i%2)*24,y:ty*TS+12+Math.floor(i/2)*24,vx:(i%2?1:-1)*(120+Math.random()*60),vy:-650+Math.floor(i/2)*220,r:0,vr:(Math.random()-.5)*12,life:1.4,k:'brick'});}
    else{G.bumps.push({x:tx,y:ty,t:0});sfx.bump();}}
  else sfx.bump();
}
function killFlip(e,dir){e.dead=true;e.flip=true;e.vy=-450;e.vx=dir*90;e.t=1.6;comboFree(e);}
function comboFree(e){addScore(200,e.x+e.w/2,e.y);}

function stepPlayer(dt){
  const p=G.p,In=I();

function stepEnemies(dt){
  const p=G.p;
  for(const e of G.enemies){
    if(!e.active){if(e.x<G.camX+VW+TS*2)e.active=true;else continue;}
    e.anim+=dt;

    if(e.kg>0)e.kg-=dt;

    e.x+=e.vx*dt;const hx=collideX(e,Math.sign(e.vx));if(hx){e.vx=-e.vx;if(e.state==='roll'&&e.x>G.camX-50&&e.x<G.camX+VW)sfx.bump();}
    e.y+=e.vy*dt;if(e.vy>0&&landY(e))e.vy=0;

    else{if(a.x<b.x){a.vx=-Math.abs(a.vx);b.vx=Math.abs(b.vx);}else{a.vx=Math.abs(a.vx);b.vx=-Math.abs(b.vx);}}}
  if(p.dead||G.goal)return;

}
function stepItems(dt){

function press(btn){
  audio();
  if(screen==='menu'||screen==='pause'||screen==='over'||screen==='win'){
    if(screen==='pause'&&(btn==='stop'||btn==='menu'||btn==='start')){resume();return;}
    if(btn==='menu'&&screen==='menu'&&levelsOpen){showMenu();return;}
    if(btn==='menu'&&screen==='menu'&&EMB){exitHub();return;}
    if(btn==='menu'&&screen!=='menu'){showMenu();return;}
    listInput(btn);return;}
  if(screen==='play'){
    if(btn==='a'||btn==='up'||btn==='r'){G.p.jbuf=.12;}
    if(btn==='stop'||btn==='start'||btn==='menu')pause();
  }
}

dpad.addEventListener('pointermove',e=>{if(!dpts.has(e.pointerId))return;const old=dpts.get(e.pointerId),s=dirsFor(e);dpts.set(e.pointerId,s);applyD();s.forEach(k=>{if(!old.has(k))press(k);});});
const dEnd=e=>{if(dpts.delete(e.pointerId))applyD();};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpad.addEventListener(ev,dEnd));
const KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',' ':'a',j:'a',Shift:'b',k:'b',x:'b',Enter:'start',p:'stop',Escape:'menu'};
window.addEventListener('keydown',e=>{const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(!k)return;e.preventDefault();app.classList.add('kbd');if(e.repeat)return;if(k in kb)kb[k]=1;press(k);});
window.addEventListener('keyup',e=>{const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(k&&k in kb)kb[k]=0;});
window.addEventListener('blur',()=>{for(const k in kb)kb[k]=0;if(screen==='play')pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='play')pause();});

/* ===================== Resize + loop ===================== */
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;DPR=Math.min(2,window.devicePixelRatio||1);
  SC=Math.min(r.height/VH,r.width/(10*TS));VW=r.width/SC;VHF=r.height/SC;offY=VHF-VH;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  const hero=FRONT;hero.style.height=(3.3*TS*SC)+'px';hero.style.bottom=(2*TS*SC-4)+'px';}
new ResizeObserver(resize).observe(stage);resize();
let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;const STEP=1/120;
  while(acc>=STEP){step(STEP);acc-=STEP;}
  if(screen==='menu'){const b=Math.abs(Math.sin(now/1000*Math.PI*1.1));FRONT.style.transform=`translateX(-50%) translateY(${-b*10}px) scale(${1+(1-b)*.03},${1-(1-b)*.03})`;}
  render(now/1000);
}
showMenu();requestAnimationFrame(frame);
})();
</script>
