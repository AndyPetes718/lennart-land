<title>Dansegulvet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: one full-screen concert stage; on-screen controller overlays the bottom corners in landscape, sits under the stage in portrait. Single dark stage look by design. */
:root{
  --night:#0a1222; --haze:#1c2c4c; --mist:#9fb3d9; --spot:#eef3ff;
  --camel:#f0ae4c; --blush:#ff6f91; --mint:#5fe0b5; --sky:#5cc8ff;
  --ink:#f4f6fb; --line:rgba(230,236,255,.6); --glass:rgba(8,14,30,.72); --pad-fill:rgba(12,20,40,.55);
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --c:clamp(150px,25vmin,330px);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--camel);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:1fr;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.stage{position:relative;overflow:hidden;min-height:0;
  background:
   radial-gradient(60% 45% at 50% 38%,rgba(120,150,210,.28),transparent 70%),
   radial-gradient(90% 60% at 50% 105%,rgba(90,110,160,.35),transparent 70%),
   linear-gradient(180deg,#070d1a 0%,var(--haze) 55%,#16233d 75%,#0d1628 100%)}
.cone{position:absolute;left:50%;top:-5%;width:70%;height:100%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(220,232,255,.02),rgba(220,232,255,.16) 80%,rgba(220,232,255,.05));
  clip-path:polygon(45% 0,55% 0,86% 86%,14% 86%);filter:blur(14px);pointer-events:none}
.floorspot{position:absolute;left:50%;bottom:9%;width:min(62%,90vmin);height:13%;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%,rgba(245,248,255,.95),rgba(220,232,255,.55) 55%,rgba(200,215,255,0) 72%);
  border-radius:50%;filter:blur(2px)}
.beam{position:absolute;top:-10%;width:22%;height:90%;opacity:0;pointer-events:none;filter:blur(10px);transition:opacity .35s ease-out}
.beam.l{left:2%;transform:rotate(-22deg);transform-origin:top center;background:linear-gradient(180deg,var(--blush),transparent 85%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.beam.r{right:2%;transform:rotate(22deg);transform-origin:top center;background:linear-gradient(180deg,var(--sky),transparent 85%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.beam.on{opacity:.45;transition:none}

.lennart{position:absolute;left:50%;bottom:11.5%;height:47%;aspect-ratio:686/719;transform:translateX(-50%);pointer-events:none}
.shadow{position:absolute;left:12%;right:12%;bottom:-3%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,14,30,.55),transparent)}
.mover,.bob{position:absolute;inset:0;transform-origin:50% 100%}
.view{position:absolute;bottom:0;display:block;max-width:none;opacity:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));will-change:transform,opacity}
.v-front{left:0;width:100%;height:100%;transform-origin:50% 100%}
.v-side,.v-sidem{left:12.1%;width:92.1%;height:90.8%;transform-origin:41.1% 100%}
.v-back{left:7.9%;width:84.4%;height:106.7%;bottom:-6.8%;transform-origin:50% 100%}

/* HUD */
.hud{position:absolute;top:2.5%;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud .box{background:var(--glass);border:1.5px solid var(--line);border-radius:14px;padding:.35em .8em;font-size:clamp(14px,2.6vmin,30px);min-width:0}
.hud .lbl{display:block;font-size:.55em;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);font-weight:600}
.hud .val{font-family:var(--display);font-size:1.5em;line-height:1.05;font-variant-numeric:tabular-nums}
.hud .mult{color:var(--camel)}

.track{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:min(92%,1100px);height:clamp(54px,11vmin,120px);
  border-radius:999px;background:linear-gradient(90deg,rgba(8,14,30,.75),rgba(8,14,30,.45));border:1.5px solid var(--line);overflow:hidden}
.ring{position:absolute;left:10%;top:50%;width:calc(var(--th) * .82);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid var(--spot);box-shadow:0 0 0 4px rgba(238,243,255,.12),0 0 24px rgba(238,243,255,.35) inset}
.note{position:absolute;top:50%;width:calc(var(--th) * .7);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;background:var(--col);color:var(--night);font-family:var(--display);font-size:calc(var(--th) * .42);box-shadow:0 0 14px var(--col)}
.note svg{width:62%;height:62%;fill:var(--night)}
.note.hit{animation:pop .25s ease-out forwards}
.note.miss{opacity:.25;filter:grayscale(1)}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}

.judge{position:absolute;left:50%;top:31%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(28px,7vmin,80px);
  text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;opacity:0}
.count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(60px,18vmin,200px);color:var(--spot);text-shadow:0 0 30px rgba(160,190,255,.7);pointer-events:none}
.hint{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);color:var(--mist);font-size:clamp(12px,2vmin,20px);text-align:center;width:min(60%,700px);pointer-events:none}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none}

/* Menu */
.menu{position:absolute;inset:0}
.title{position:absolute;top:4%;left:50%;transform:translateX(-50%);text-align:center;width:min(94%,1000px);pointer-events:none}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,11vmin,140px);line-height:.9;letter-spacing:.01em;
  color:var(--camel);text-shadow:0 5px 0 #8a5317,0 0 40px rgba(240,174,76,.35)}
.title p{margin:.15em 0 0;font-family:var(--display);font-size:clamp(20px,4.6vmin,56px);letter-spacing:.28em;text-transform:uppercase;color:var(--spot)}
.list{display:flex;flex-direction:column;gap:clamp(8px,1.4vmin,16px)}
.menu .list{position:absolute;left:5%;top:26%;width:clamp(200px,30vmin,380px)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:2px solid var(--line);background:var(--pad-fill);
  border-radius:16px;padding:.4em .9em;font-size:clamp(16px,2.8vmin,32px);font-weight:600;min-height:44px;white-space:nowrap}
.item .arr{opacity:0;color:var(--night);font-size:.7em}
.item.sel{background:var(--camel);border-color:var(--camel);color:var(--night);box-shadow:0 0 24px rgba(240,174,76,.45)}
.item.sel .arr{opacity:1}
.item .cyc{font-weight:700}
.side{position:absolute;right:5%;top:26%;width:clamp(200px,28vmin,360px);background:var(--glass);border:1.5px solid var(--line);border-radius:16px;
  padding:.8em 1em;font-size:clamp(13px,2.1vmin,24px);line-height:1.4}
.side h2{margin:0 0 .3em;font-family:var(--display);font-weight:400;font-size:1.3em;color:var(--camel)}
.side dl{display:grid;grid-template-columns:auto 1fr;gap:.15em .7em;margin:0}
.side dt{color:var(--mist)} .side dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.side .keys{margin-top:.6em;color:var(--mist);font-size:.85em}

/* Modal */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,20,.55);backdrop-filter:blur(3px)}
.card{width:min(92%,520px);background:var(--glass);border:2px solid var(--line);border-radius:22px;padding:clamp(16px,3vmin,36px);text-align:center}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,7vmin,76px);color:var(--camel)}
.stars{font-size:clamp(34px,7vmin,80px);letter-spacing:.1em;color:rgba(238,243,255,.2);margin:.1em 0}
.stars b{color:var(--camel);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.4em 0 1em;font-size:clamp(13px,2.2vmin,24px)}
.stats div{border:1.5px solid var(--line);border-radius:12px;padding:.3em}
.stats span{display:block;font-family:var(--display);font-size:1.6em;font-variant-numeric:tabular-nums}
.card .big{font-family:var(--display);font-size:clamp(28px,6vmin,64px);font-variant-numeric:tabular-nums}
.card .rec{color:var(--blush);font-weight:700;min-height:1.3em}
.card .list .item{justify-content:center}

/* Controller */
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.cluster{position:relative;width:var(--c);height:calc(var(--c) * 1.22);pointer-events:auto;touch-action:none}
.cb{position:absolute;display:grid;place-items:center;border:2px solid var(--line);background:var(--pad-fill);color:var(--ink);
  border-radius:50%;padding:0;font-family:var(--body);font-weight:700;touch-action:none;transition:transform .06s,background .06s}
.cb svg{width:42%;height:42%;fill:currentColor}
.cb.down{background:var(--camel);color:var(--night);border-color:var(--camel);transform:scale(.93)}
.pill{border-radius:999px;font-size:calc(var(--c) * .1)}
.disc{position:absolute;border-radius:50%;border:2px solid var(--line);background:rgba(12,20,40,.35)}
.dot{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line)}
.letter{font-size:calc(var(--c) * .15);font-family:var(--display);font-weight:400}

@media (max-aspect-ratio:1/1){
  :root{--c:clamp(140px,42vw,250px)}
  .app{grid-template-rows:1fr auto}
  .controls{position:static;background:#070d1a;padding-top:14px;border-top:1.5px solid rgba(230,236,255,.15)}
  .menu .list{left:16px;top:27%;width:48%}
  .side{display:none}
  .menu~.lennart,.app.inmenu .lennart{left:74%;height:36%}
  .app.inmenu .floorspot{left:74%;width:52%}
  .app.inmenu .cone{left:74%}
  .hint{width:90%}
}
@media (prefers-reduced-motion:reduce){.beam{display:none}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);
const app=$('#app'),mover=$('#mover'),bob=$('#bob'),shadow=$('#shadow'),track=$('#track');
const DIFFS=[{name:'Let',bpm:96},{name:'Normal',bpm:112},{name:'Svær',bpm:128}];
const COL={left:'var(--blush)',down:'var(--sky)',up:'var(--mint)',right:'var(--camel)',a:'var(--ink)',b:'var(--ink)'};
const ROT={up:0,right:90,down:180,left:270};
const ARROW='<svg viewBox="0 0 24 24"><path d="M12 3 21 14H15.5V21H8.5V14H3Z"/></svg>';
const TRAVEL=2.0;

const st={screen:'menu',diff:1,sound:true,list:null};
let recs={0:0,1:0,2:0};
try{const r=JSON.parse(localStorage.getItem('lennart-recs')||'null');if(r)recs=Object.assign(recs,r);}catch(e){}
try{const s=JSON.parse(localStorage.getItem('lennart-set')||'null');if(s){st.diff=s.diff??1;st.sound=s.sound??true;}}catch(e){}
function saveSet(){try{localStorage.setItem('lennart-set',JSON.stringify({diff:st.diff,sound:st.sound}))}catch(e){}}

/* ---------- Audio ---------- */
let ctx=null,master=null,noiseBuf=null,song=null,timer=null;
function ensureAudio(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); const comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.connect(comp).connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  master.gain.value=st.sound?.55:0;
  if(ctx.state==='suspended') ctx.resume();
  return true;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);env(g,t,.003,.9,.3);o.connect(g).connect(master);o.start(t);o.stop(t+.4);}
function noise(t,dur,freq,type,vol){const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ctx.createGain();env(g,t,.002,vol,dur);s.connect(f).connect(g).connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
function tone(t,m,dur,type,vol,cut){const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.value=mf(m);f.type='lowpass';f.frequency.value=cut||3000;env(g,t,.005,vol,dur);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.05);}
const PROG=[36,33,29,31],QUAL=[[0,4,7],[0,3,7],[0,4,7],[0,4,7]];
const BASS=[[1,0],[0,0],[1,12],[1,0],[0,0],[1,12],[0,0],[1,7]];
function playStep(s,t){
  const beat=s/2;
  if(beat<4){ if(s%2===0) tone(t,beat===3?84:79,.08,'square',.12,5000); return; }
  if(song.mode==='rytme'&&beat>=68){ if(s===136){kick(t);QUAL[0].forEach(i=>tone(t,60+i,.9,'sawtooth',.08,2200));tone(t,36,.9,'triangle',.35,600);} return; }
  const b=beat-4,bar=Math.floor(b/4)%4,k=(s-8)%8,root=PROG[bar],q=QUAL[bar];
  if(k===0||k===4||(k===7&&bar%2===1)) kick(t);
  if(k===2||k===6){noise(t,.16,1600,'highpass',.32);tone(t,55,.08,'triangle',.18,2000);}
  noise(t,k%2?.06:.03,7500,'highpass',k%2?.09:.06);
  if(BASS[k][0]) tone(t,root+BASS[k][1],.16,'square',.16,700);
  if(b>=16&&(k===3||k===7)) q.forEach(i=>tone(t,root+24+i,.12,'sawtooth',.045,2400));
  if(b>=32){const arp=[0,1,2,1,0,2,1,2][k];tone(t,root+36+q[arp],.1,'triangle',.07,4000);}
}
function scheduler(){
  if(!song||!ctx||ctx.state!=='running')return;
  const maxStep=song.mode==='rytme'?138:Infinity;
  while(song.nextStep<maxStep&&song.t0+song.nextStep*song.spb/2<ctx.currentTime+.12){playStep(song.nextStep,song.t0+song.nextStep*song.spb/2);song.nextStep++;}
}

/* ---------- Chart ---------- */
function makeChart(d){
  let seed=11+d*31;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const dirs=['left','down','up','right'],notes=[];let prev='';
  for(let b=4;b<68;b+=(d===0?2:1)){
    if(d>0&&b%16===15)continue;
    let dir=dirs[Math.floor(rnd()*4)]; if(dir===prev&&rnd()<.6)dir=dirs[(dirs.indexOf(dir)+1)%4];
    if(d>=1&&b%8===4&&b>8&&rnd()<.55)dir='a';
    if(d===2&&b%16===12)dir='b';
    if(d===0&&b%16===12)dir='a';
    notes.push({t:b,dir});prev=dir;
    if(d===2&&b%2===1&&b%16!==15&&rnd()<.35)notes.push({t:b+.5,dir:dirs[Math.floor(rnd()*4)]});
  }
  return notes;
}

/* ---------- Lennart: 3D views + move engine ---------- */
const VIEWS=['.v-front','.v-side','.v-back','.v-sidem'].map((c,i)=>({el:document.querySelector(c),mirror:i===3}));
const smooth=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);};
function setYaw(yaw){
  const th=((yaw%360)+360)%360,i=Math.floor(th/90)%4,f=(th-i*90)/90,j=(i+1)%4,w=smooth(.38,.62,f);
  VIEWS.forEach((v,k)=>{
    let op=0,d=1,z=0;
    if(k===i){op=w>.995?0:1;d=f;z=1;} if(k===j){op=w;d=1-f;z=2;}
    if(i===j&&k===i)op=1;
    v.el.style.opacity=op;v.el.style.zIndex=z;
    if(op>0){const sx=.78+.22*Math.cos(Math.min(d,.5)*Math.PI);v.el.style.transform=`scaleX(${v.mirror?-sx:sx})`;}
  });
}
const N={x:0,y:0,r:0,sx:1,sy:1,yaw:0,k:0};
const lin=t=>t,io=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,snap=t=>1-Math.pow(1-t,7),out=t=>1-Math.pow(1-t,3);
// keyframes: at = fraction of move, any pose props, e = easing into this frame
const MOVES={
  left:{beats:1,k:[{at:.35,x:-20,y:-7,yaw:-60,r:-9,e:out},{at:.62,x:-23,y:2,yaw:-70,r:-4,sx:1.08,sy:.92},{at:1,e:io}]},
  right:{beats:1,k:[{at:.35,x:20,y:-7,yaw:60,r:9,e:out},{at:.62,x:23,y:2,yaw:70,r:4,sx:1.08,sy:.92},{at:1,e:io}]},
  up:{beats:1.5,k:[{at:.15,y:4,sx:1.14,sy:.85},{at:.55,y:-42,r:360,sx:.94,sy:1.08,e:out},{at:.82,y:4,r:360,sx:1.15,sy:.85,e:t=>t*t},{at:1,r:360,e:out}]},
  down:{beats:1,k:[{at:.2,y:6,sx:1.2,sy:.78,r:-7},{at:.45,y:-7,sx:.95,sy:1.07,r:0,e:out},{at:.7,y:6,sx:1.2,sy:.78,r:7},{at:1,e:out}]},
  a:{beats:1.5,k:[{at:.15,y:4,sx:1.1,sy:.9},{at:.55,y:-16,yaw:400,e:io},{at:.85,y:0,yaw:720,e:io},{at:.92,y:3,yaw:720,sx:1.1,sy:.9},{at:1,yaw:720}]},
  b:{beats:4,k:[{at:.08,yaw:90,e:out},{at:.46,yaw:90,x:-36,k:1,e:lin},{at:.56,yaw:270,x:-36,k:.3,e:io},{at:.92,yaw:270,x:0,k:1,e:lin},{at:1,yaw:360,e:out}]},
  l:{beats:2,k:[{at:.1,yaw:-45,r:-6,e:snap},{at:.35,yaw:-45,r:-6,y:-5,e:snap},{at:.47,yaw:45,r:6,y:0,e:snap},{at:.72,yaw:45,r:6,y:-5,e:snap},{at:.84,yaw:0,r:0,y:0,e:snap},{at:1}]},
  r:{beats:2,k:[{at:.2,x:8,r:16,sx:.9,sy:1.12,yaw:25,e:out},{at:.42,x:8,r:16,sx:.9,sy:1.12,yaw:25},{at:.62,x:-8,r:-16,sx:.9,sy:1.12,yaw:-25,e:out},{at:.84,x:-8,r:-16,sx:.9,sy:1.12,yaw:-25},{at:1,e:io}]},
};
const PROPS=['x','y','r','sx','sy','yaw','k'];
let cur=null,pose={...N},idleW=1;
function norm180(a){a=((a%360)+360)%360;return a>180?a-360:a;}
function doMove(m){
  const M=MOVES[m];if(!M)return;
  const spb=song?song.spb:60/108;
  const from={...pose,yaw:norm180(pose.yaw),r:norm180(pose.r)};
  const frames=[{at:0,...from},...M.k.map(f=>{const o={at:f.at,e:f.e||io};PROPS.forEach(p=>o[p]=f[p]!==undefined?f[p]:N[p]);return o;})];
  cur={frames,start:performance.now(),dur:Math.max(350,M.beats*spb*1000)};
  if(song)song.moves++;
}
function evalMove(now){
  if(!cur)return null;
  const f=(now-cur.start)/cur.dur;
  if(f>=1){cur=null;return null;}
  const F=cur.frames;let i=1;while(i<F.length-1&&F[i].at<f)i++;
  const a=F[i-1],b=F[i],u=b.e((f-a.at)/(b.at-a.at||1)),p={};
  PROPS.forEach(k=>p[k]=a[k]+(b[k]-a[k])*u);return p;
}
function renderLennart(now,beat,inMenu){
  const mv=evalMove(now);
  idleW+=((mv?0:1)-idleW)*.12;
  const idleYaw=inMenu?32*Math.sin(now/1000*.9):10*Math.sin(beat*Math.PI/2);
  const p=mv||{...N};
  pose={...p};
  const step=p.k*Math.abs(Math.sin(beat*Math.PI*2));
  const yaw=p.yaw+idleYaw*idleW;
  const y=p.y-step*4,r=p.r+p.k*3*Math.sin(beat*Math.PI*2);
  mover.style.transform=`translate(${p.x}%,${y}%) translate(0,-50%) rotate(${r}deg) translate(0,50%) scale(${p.sx},${p.sy})`;
  setYaw(yaw);
  const lift=Math.max(0,-y);
  shadow.style.transform=`translateX(${p.x*.9}%) scale(${Math.max(.45,1-lift/60)})`;
  shadow.style.opacity=Math.max(.4,1-lift/70);
}

/* ---------- Lists (menu / pause / results) ---------- */
function renderList(el){
  const L=st.list; el.innerHTML='';
  L.items.forEach((it,i)=>{
    const b=document.createElement('button');b.className='item'+(i===L.sel?' sel':'');b.setAttribute('role','menuitem');
    const lab=typeof it.label==='function'?it.label():it.label;
    b.innerHTML=`<span>${lab}</span>`+(it.cycle?`<span class="cyc">‹ ${it.value()} ›</span>`:'<span class="arr">▶</span>');
    b.addEventListener('pointerdown',e=>{e.preventDefault();L.sel=i;if(it.cycle&&e.target.closest('.cyc'))it.cycle(1);else it.act?it.act():it.cycle&&it.cycle(1);refresh();});
    el.appendChild(b);
  });
  L.el=el;
}
function refresh(){if(st.list&&st.list.el)renderList(st.list.el);}
function listInput(btn){
  const L=st.list;if(!L)return;const it=L.items[L.sel];
  if(btn==='up')L.sel=(L.sel+L.items.length-1)%L.items.length;
  else if(btn==='down')L.sel=(L.sel+1)%L.items.length;
  else if((btn==='left'||btn==='right')&&it.cycle)it.cycle(btn==='left'?-1:1);
  else if(btn==='a'||btn==='start'){if(it.act)it.act();else if(it.cycle)it.cycle(1);}
  refresh();
}

const EMB=window.parent!==window;function exitHub(){try{parent.postMessage({lennart:'exit'},'*')}catch(e){}}
function showMenu(){
  stopSong();
  st.screen='menu';app.classList.add('inmenu');
  $('#menu').hidden=false;$('#modal').hidden=true;$('#hud').hidden=true;track.hidden=true;$('#hint').hidden=true;$('#count').textContent='';
  st.list={sel:0,items:[
    {label:'Spil',act:()=>startGame('rytme')},
    {label:'Fri dans',act:()=>startGame('fri')},
    {label:'Niveau',cycle:d=>{st.diff=(st.diff+d+3)%3;saveSet();},value:()=>DIFFS[st.diff].name},
    {label:'Lyd',cycle:()=>{st.sound=!st.sound;saveSet();if(master)master.gain.value=st.sound?.55:0;},value:()=>st.sound?'Til':'Fra'},
    {label:'Fuld skærm',act:()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}},
    ...(EMB?[{label:'Alle spil',act:exitHub}]:[]),
  ]};
  renderList($('#menuList'));renderRecs();
}
function renderRecs(){$('#recs').innerHTML=DIFFS.map((d,i)=>`<dt>${d.name}</dt><dd>${recs[i].toLocaleString('da-DK')}</dd>`).join('');}

/* ---------- Game ---------- */
function stopSong(){song=null;if(timer){clearInterval(timer);timer=null;}track.querySelectorAll('.note').forEach(n=>n.remove());if(ctx&&ctx.state==='suspended')ctx.resume();}
function startGame(mode){
  stopSong();
  if(!ensureAudio()){return;}
  const spb=60/DIFFS[st.diff].bpm;
  song={mode,spb,t0:ctx.currentTime+.3,nextStep:0,notes:mode==='rytme'?makeChart(st.diff):[],lastBeat:-1,score:0,combo:0,maxCombo:0,perfect:0,good:0,miss:0,moves:0,ended:false};
  timer=setInterval(scheduler,25);scheduler();
  st.screen='game';st.list=null;app.classList.remove('inmenu');
  $('#menu').hidden=true;$('#modal').hidden=true;$('#hud').hidden=false;
  track.hidden=mode!=='rytme';
  $('#comboBox').querySelector('.lbl').textContent=mode==='rytme'?'Kombo':'Trin';
  const h=$('#hint');h.hidden=false;
  h.textContent=mode==='rytme'?'Tryk på den rigtige knap, når tegnet rammer ringen':'Fri dans! Brug knapperne til at få Lennart til at danse. Menu-knappen stopper.';
  updHud();
}
function nowBeat(){return (ctx.currentTime-song.t0)/song.spb;}
function mult(){return Math.min(4,1+Math.floor(song.combo/10));}
function updHud(){
  if(!song)return;
  $('#score').textContent=song.mode==='rytme'?song.score.toLocaleString('da-DK'):DIFFS[st.diff].bpm+' bpm';
  $('#score').previousElementSibling.textContent=song.mode==='rytme'?'Point':'Tempo';
  $('#combo').textContent=song.mode==='rytme'?song.combo:song.moves;
  $('#mult').textContent=song.mode==='rytme'&&mult()>1?'×'+mult():'';
}
let judgeAnim=null;
function showJudge(text,color){
  const j=$('#judge');j.textContent=text;j.style.color=color;
  if(judgeAnim)judgeAnim.cancel();
  judgeAnim=j.animate([{opacity:0,transform:'translateX(-50%) scale(.6)'},{opacity:1,transform:'translateX(-50%) scale(1.1)',offset:.2},{opacity:1,transform:'translateX(-50%) scale(1)',offset:.7},{opacity:0,transform:'translateX(-50%) translateY(-20%) scale(1)'}],{duration:650,fill:'forwards'});
}
function sparks(color){
  const stage=$('#stage'),r=$('#lennart').getBoundingClientRect(),sr=stage.getBoundingClientRect();
  const cx=r.left-sr.left+r.width/2,cy=r.top-sr.top+r.height*.45;
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='spark';s.style.background=color;s.style.left=cx+'px';s.style.top=cy+'px';stage.appendChild(s);
    const a=Math.random()*Math.PI*2,d=r.width*(.45+Math.random()*.4);
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}
function judge(btn){
  const beat=nowBeat();let best=null,bd=1e9;
  for(const n of song.notes){if(n.res)continue;const d=Math.abs(n.t-beat)*song.spb;if(d<bd){bd=d;best=n;}if(n.t-beat>2)break;}
  if(!best||bd>.24)return;
  if(best.dir!==btn){setMiss(best,'Forkert!');return;}
  best.res='hit';if(best.el)best.el.classList.add('hit');
  song.combo++;song.maxCombo=Math.max(song.maxCombo,song.combo);
  if(bd<.085){song.perfect++;song.score+=100*mult();showJudge('Perfekt!','var(--camel)');sparks(COL[best.dir]);}
  else{song.good++;song.score+=50*mult();showJudge('Godt!','var(--mint)');}
  updHud();
}
function setMiss(n,txt){n.res='miss';if(n.el)n.el.classList.add('miss');song.miss++;song.combo=0;showJudge(txt,'var(--blush)');updHud();}

function updateGame(beat){
  const c=$('#count');
  if(beat<4){const n=Math.floor(beat);c.textContent=beat<0?'':(n<3?String(3-n):'Dans!');}
  else if(c.textContent)c.textContent='';
  const ib=Math.floor(beat);
  if(ib!==song.lastBeat){song.lastBeat=ib;if(ib>=4&&(song.mode==='fri'||ib<68)){const b=ib%2?'#beamR':'#beamL';const el=$(b);el.classList.add('on');setTimeout(()=>el.classList.remove('on'),60);}}
  if(song.mode!=='rytme')return;
  const th=track.clientHeight;track.style.setProperty('--th',th+'px');
  for(const n of song.notes){
    const dt=(n.t-beat)*song.spb;
    if(dt>TRAVEL)break;
    if(!n.res&&dt<-.24)setMiss(n,'Øv!');
    if(!n.el&&dt>-.4){
      const e=document.createElement('div');e.className='note';e.style.setProperty('--col',COL[n.dir]);
      e.innerHTML=(n.dir==='a'||n.dir==='b')?n.dir.toUpperCase():ARROW;
      if(ROT[n.dir]!==undefined)e.firstChild.style.transform=`rotate(${ROT[n.dir]}deg)`;
      track.appendChild(e);n.el=e;
    }
    if(n.el){
      if(dt<-.5){n.el.remove();n.el=null;n.gone=true;continue;}
      if(n.res!=='hit')n.el.style.left=(10+dt/TRAVEL*86)+'%';
    }
  }
  if(beat>70&&!song.ended){song.ended=true;showResults();}
}

function showPause(){
  if(!song||!ctx)return;
  ctx.suspend();st.screen='pause';
  $('#modal').hidden=false;
  $('#card').innerHTML='<h2>Pause</h2><div class="list" id="pList" style="margin-top:1em"></div>';
  st.list={sel:0,items:[{label:'Fortsæt',act:resume},{label:'Start forfra',act:()=>startGame(song.mode)},{label:'Til menuen',act:showMenu}]};
  renderList($('#pList'));
}
function resume(){$('#modal').hidden=true;st.screen='game';st.list=null;if(ctx)ctx.resume();}
function showResults(){
  const s=song,tot=s.notes.length,acc=tot?(s.perfect+s.good*.6)/tot:0;
  const stars=acc>=.85?3:acc>=.6?2:acc>=.3?1:0;
  const isRec=s.score>recs[st.diff];if(isRec){recs[st.diff]=s.score;try{localStorage.setItem('lennart-recs',JSON.stringify(recs))}catch(e){}}
  st.screen='results';$('#modal').hidden=false;$('#hint').hidden=true;
  const words=['Prøv igen!','Godt gået!','Flot dans!','Lennart er stolt!'];
  $('#card').innerHTML=`<h2>${words[stars]}</h2><div class="stars"><b>${'★'.repeat(stars)}</b>${'★'.repeat(3-stars)}</div>
   <div class="big">${s.score.toLocaleString('da-DK')}</div><div class="rec">${isRec?'Ny rekord på '+DIFFS[st.diff].name+'!':''}</div>
   <div class="stats"><div>Perfekt<span>${s.perfect}</span></div><div>Godt<span>${s.good}</span></div><div>Missede<span>${s.miss}</span></div></div>
   <div class="list" id="rList"></div>`;
  st.list={sel:0,items:[{label:'Spil igen',act:()=>startGame('rytme')},{label:'Til menuen',act:showMenu}]};
  renderList($('#rList'));
  doMove('a');
}

/* ---------- Input ---------- */
const DANCE=['left','right','up','down','a','b','l','r'];
function press(btn){
  if(st.screen==='menu'){
    if(btn==='menu'&&EMB){exitHub();return;}
    if(DANCE.includes(btn)&&btn!=='a'&&btn!=='up'&&btn!=='down'&&btn!=='left'&&btn!=='right')doMove(btn);
    listInput(btn);return;
  }
  if(st.screen==='game'){
    if(DANCE.includes(btn)){doMove(btn);if(song&&song.mode==='rytme'&&btn!=='l'&&btn!=='r')judge(btn);else if(song)updHud();}
    else if(btn==='stop'||btn==='menu')showPause();
    return;
  }
  if(st.screen==='pause'){
    if(btn==='stop')resume();
    else if(btn==='menu')showMenu();
    else listInput(btn);
    return;
  }
  if(st.screen==='results'){if(btn==='menu')showMenu();else listInput(btn);}
}
function flash(btn){const el=document.querySelector(`.cb[data-btn="${btn}"]`);if(!el)return;el.classList.add('down');setTimeout(()=>el.classList.remove('down'),120);}
document.querySelectorAll('.cb').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');press(b.dataset.btn);});
  const up=()=>b.classList.remove('down');
  b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',' ':'a',j:'a',k:'b',b:'b',q:'l',e:'r',Enter:'start',p:'stop',Escape:'menu',m:'menu'};
window.addEventListener('keydown',e=>{
  const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(!k)return;
  e.preventDefault();if(e.repeat)return;flash(k);press(k);
});

/* ---------- Loop ---------- */
const DEMO=['a','b','up','r','left','right','l','down'];let demoPh=null;
function loop(now){
  requestAnimationFrame(loop);
  let beat;const inMenu=!(song&&ctx&&st.screen!=='menu');
  if(!inMenu)beat=nowBeat();else beat=now/1000*100/60;
  const p=((beat%1)+1)%1;
  const yb=-Math.pow(Math.sin(Math.PI*p),2)*3.2,sq=Math.max(0,1-p*7)*.035;
  bob.style.transform=`translateY(${yb}%) scale(${1+sq},${1-sq})`;
  if(inMenu&&st.screen==='menu'){const ph=Math.floor(beat/12);if(ph!==demoPh){if(demoPh!==null&&!cur)doMove(DEMO[ph%DEMO.length]);demoPh=ph;}}
  renderLennart(now,beat,inMenu);
  if(song&&st.screen==='game')updateGame(beat);
}
showMenu();
requestAnimationFrame(loop);
})();
</script>
