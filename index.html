<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lennart Land</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: arcade lobby — title + Lennart on the left, big touchable game cards on the right; stacks on narrow screens. Single committed look. */
:root{
  --night:#1b1230; --dusk:#3a1f52; --sand:#f3c97f; --camel:#f0ae4c; --rust:#c2552f; --cream:#fff6e6; --muted:#d9c7e8;
  --card:#2b1c44; --line:rgba(255,246,230,.28);
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
.lobby{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:clamp(16px,4vw,64px);align-items:center;
  padding-block:clamp(16px,4vh,48px);overflow-y:auto}
.sky{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 50% at 18% 70%,rgba(240,174,76,.28),transparent 70%),
  linear-gradient(180deg,#1b1230 0%,#3a1f52 55%,#7a3a4a 82%,#c2552f 100%)}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:
  radial-gradient(120% 100% at 30% 100%,#d69650 60%,transparent 61%),radial-gradient(120% 100% at 85% 100%,#b97a3b 55%,transparent 56%)}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(48px,9vw,150px);line-height:.88;color:var(--sand);
  text-shadow:0 .05em 0 var(--rust),0 .1em 0 #7a2c1a,0 .16em .25em rgba(0,0,0,.35);text-wrap:balance}
.brand p{margin:.6em 0 0;font-size:clamp(15px,1.6vw,24px);color:var(--muted)}
.brand img{width:min(80%,340px);margin-top:clamp(8px,3vh,32px);filter:drop-shadow(0 14px 12px rgba(0,0,0,.35));transform-origin:50% 100%;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1.02,.98)}50%{transform:translateY(-10px) scale(1)}}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(14px,2vw,28px);min-width:0;align-content:center}
.game{display:flex;flex-direction:column;text-align:left;padding:0;border:3px solid var(--line);border-radius:22px;background:var(--card);color:inherit;font:inherit;
  overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;touch-action:manipulation}
.game .shot{aspect-ratio:16/9;width:100%;max-width:100%;display:block;object-fit:cover;background:#120b20}
.game .info{padding:clamp(12px,1.6vw,22px);display:flex;flex-direction:column;gap:.3em}
.game h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,2.8vw,44px);color:var(--sand);line-height:1}
.game span{color:var(--muted);font-size:clamp(14px,1.3vw,20px);line-height:1.35}
.game .play{margin-top:.5em;align-self:flex-start;background:var(--camel);color:#3a1d0c;font-weight:700;border-radius:999px;padding:.35em 1.1em;font-size:clamp(16px,1.5vw,24px)}
.game.sel,.game:hover{border-color:var(--camel);transform:translateY(-4px);box-shadow:0 10px 0 #a3561f,0 0 40px rgba(240,174,76,.35)}
.game:focus-visible{outline:4px solid var(--cream);outline-offset:4px}
.soon{border:3px dashed var(--line);border-radius:22px;display:grid;place-content:center;text-align:center;padding:24px;color:var(--muted);min-height:200px}
.soon b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.2vw,34px);color:var(--cream);display:block;margin-bottom:.2em}
.player{position:fixed;inset:0;z-index:5;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(24px,4vw,48px);color:var(--sand)}
.err{position:absolute;inset:0;display:grid;place-content:center;gap:16px;text-align:center;padding:24px;font-size:20px}
.err button{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--camel);color:#3a1d0c;padding:.5em 1.4em;cursor:pointer}
@media (max-width:760px){
  body{overflow:auto}
  .lobby{grid-template-columns:1fr;align-items:start;height:auto;min-height:100%}
  .brand img{width:150px}
}
@media (prefers-reduced-motion:reduce){.brand img{animation:none}.game{transition:none}}
</style>

</head>
<body>
<div class="sky"></div>
<canvas class="stars" id="stars"></canvas>
<main class="lobby" id="lobby">
  <section class="brand">
    <h1>Lennart Land</h1>
    <p>Vælg et spil med fingeren, WASD eller piletasterne</p>
    <img src="lennart.webp" alt="Lennart">
  </section>
  <section class="games" id="games" aria-label="Spil"></section>
</main>
<div class="player" id="player" hidden>
  <div class="loading" id="loading">Henter spillet …</div>
  <div class="err" id="err" hidden><div>Spillet kunne ikke hentes. Tjek forbindelsen og prøv igen.</div><button id="back">Tilbage til Lennart Land</button></div>
</div>

<script>
(()=>{
/* Add new games here: drop the game file in games/ and a 16:9 picture in thumbs/ */
const GAMES=[
  {id:'oerkenhop',name:'Ørkenhop',file:'games/oerkenhop.html',thumb:'thumbs/oerkenhop.webp',desc:'Løb, hop og saml mønter gennem ørkenen. To baner.'},
  {id:'dansegulvet',name:'Dansegulvet',file:'games/dansegulvet.html',thumb:'thumbs/dansegulvet.webp',desc:'Dans i takt med musikken, og få Lennart til at moonwalke.'},
];
const $=s=>document.querySelector(s);
const wrap=$('#games');let sel=0;
try{const i=GAMES.findIndex(g=>g.id===localStorage.getItem('lennart-land-last'));if(i>=0)sel=i;}catch(e){}
GAMES.forEach((g,i)=>{
  const b=document.createElement('button');b.className='game';b.id='g-'+g.id;
  b.innerHTML=`<img class="shot" src="${g.thumb}" alt=""><div class="info"><h2>${g.name}</h2><span>${g.desc}</span><div class="play">Spil ▶</div></div>`;
  b.addEventListener('click',()=>open(i));b.addEventListener('pointerenter',()=>{sel=i;mark();});
  wrap.appendChild(b);
});
const soon=document.createElement('div');soon.className='soon';soon.innerHTML='<div><b>Flere spil på vej</b>Lennart øver sig allerede</div>';wrap.appendChild(soon);
function mark(){[...wrap.querySelectorAll('.game')].forEach((b,i)=>b.classList.toggle('sel',i===sel));}
mark();

const player=$('#player');let frame=null,cur=-1;
async function open(i){
  const g=GAMES[i];cur=i;sel=i;mark();
  try{localStorage.setItem('lennart-land-last',g.id)}catch(e){}
  player.hidden=false;$('#loading').hidden=false;$('#err').hidden=true;
  try{
    const r=await fetch(g.file);if(!r.ok)throw new Error(r.status);const html=await r.text();
    if(cur!==i)return;
    frame=document.createElement('iframe');frame.title=g.name;frame.setAttribute('allow','fullscreen; autoplay');frame.setAttribute('allowfullscreen','');
    frame.srcdoc='<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+html+'</body></html>';
    frame.addEventListener('load',()=>{$('#loading').hidden=true;try{frame.contentWindow.focus();}catch(e){frame.focus();}});
    player.appendChild(frame);
  }catch(e){$('#loading').hidden=true;$('#err').hidden=false;}
}
function close(){if(frame){frame.remove();frame=null;}cur=-1;player.hidden=true;try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  const b=wrap.querySelectorAll('.game')[sel];if(b)b.focus({preventScroll:true});}
$('#back').addEventListener('click',close);
window.addEventListener('message',e=>{if(frame&&e.source===frame.contentWindow&&e.data&&e.data.lennart==='exit')close();});
window.addEventListener('keydown',e=>{
  if(!player.hidden)return;
  const n=GAMES.length;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='d'||k==='s'){sel=(sel+1)%n;mark();e.preventDefault();}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='a'||k==='w'){sel=(sel+n-1)%n;mark();e.preventDefault();}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();open(sel);}
});
const h=location.hash.slice(1);const hi=GAMES.findIndex(g=>g.id===h);if(hi>=0)open(hi);

/* twinkling stars */
const cv=$('#stars'),cx=cv.getContext('2d');let st=[];
function rs(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  st=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.55,r:Math.random()*1.4+.4,p:Math.random()*6}));}
addEventListener('resize',rs);rs();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function tw(t){cx.clearRect(0,0,innerWidth,innerHeight);for(const s of st){cx.globalAlpha=still?.7:.35+.45*Math.sin(t/700+s.p)**2;cx.fillStyle='#fff6e6';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();}
  if(!still)requestAnimationFrame(tw);})(0);
})();
</script>

</body>
</html>
